name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Executa diariamente à meia-noite
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permissão para fazer push no repositório

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Gerar animação da cobrinha (paleta do perfil)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300d4ff&color_dots=%230f1623,%231a2332,%23334155,%23a78bfa,%2300d4ff
            dist/github-contribution-grid-snake.gif?color_snake=%2300d4ff&color_dots=%230f1623,%231a2332,%23334155,%23a78bfa,%2300d4ff

      - name: Push para a branch de saída
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
